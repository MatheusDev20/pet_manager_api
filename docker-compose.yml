services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_pets_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

volumes:
  db_pets_data: