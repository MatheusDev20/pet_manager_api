services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_pets_data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start:dev
    volumes:
      - .:/usr/src/app
      - node_modules_api:/usr/src/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db_pets_data:
  node_modules_api:
